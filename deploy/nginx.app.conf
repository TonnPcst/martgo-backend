# Gateway config for docker-compose.app.yml: same routes as nginx.conf, but the
# APIs run as containers on the compose network instead of on the host.
server {
    listen 80;

    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id    $request_id;

    location /api/v1/auth/ { proxy_pass http://auth-api:8081; }
    location /api/v1/users { proxy_pass http://auth-api:8081; }
    location /             { proxy_pass http://mart-api:8080; }
}
