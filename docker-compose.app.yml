# Runs both APIs in containers instead of on the host. Used on top of
# docker-compose.yml:
#
#   make up-app     # build, migrate and start everything; gateway on :8000
#   make down-app   # back to infra only (for `make run` on the host)
#
# Needs martgo-auth's Postgres (`make up` in ../auth-supermarket-go-backend-project)
# and the keys in ./keys and ../auth-supermarket-go-backend-project/keys.
# Stop `make run` in both repos first: the containers publish :8080 and :8081.

x-env-mart: &env-mart
  env_file:
    - path: .env.example
    - path: .env
      required: false

x-env-auth: &env-auth
  env_file:
    - path: ../auth-supermarket-go-backend-project/.env.example
    - path: ../auth-supermarket-go-backend-project/.env
      required: false

x-db-mart: &db-mart postgres://${POSTGRES_USER:-martgo}:${POSTGRES_PASSWORD:-martgo}@postgres:5432/${POSTGRES_DB:-martgo}?sslmode=disable
# martgo-auth's Postgres runs from its own compose project, published on the host.
x-db-auth: &db-auth ${AUTH_DATABASE_URL:-postgres://martgo_auth:martgo_auth@host.docker.internal:5434/martgo_auth?sslmode=disable}

services:
  mart-migrate:
    image: martgo-api:dev
    build: .
    <<: *env-mart
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: *db-mart
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  mart-api:
    image: martgo-api:dev
    build: .
    container_name: martgo-api
    restart: unless-stopped
    <<: *env-mart
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: *db-mart
      REDIS_URL: redis://redis:6379/0
      JWT_PUBLIC_KEY_FILE: /app/keys/jwt_public.pem
      TRUST_PROXY: "true"
    volumes:
      - ./keys/jwt_public.pem:/app/keys/jwt_public.pem:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mart-migrate: { condition: service_completed_successfully }

  auth-migrate:
    image: martgo-auth:dev
    build: ../auth-supermarket-go-backend-project
    <<: *env-auth
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: *db-auth
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  auth-api:
    image: martgo-auth:dev
    build: ../auth-supermarket-go-backend-project
    container_name: martgo-auth-api
    restart: unless-stopped
    <<: *env-auth
    environment:
      HTTP_ADDR: ":8081"
      DATABASE_URL: *db-auth
      REDIS_URL: redis://redis:6379/0
      JWT_PRIVATE_KEY_FILE: /app/keys/jwt_private.pem
      TRUST_PROXY: "true"
    volumes:
      - ../auth-supermarket-go-backend-project/keys/jwt_private.pem:/app/keys/jwt_private.pem:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8081"
    depends_on:
      redis: { condition: service_healthy }
      auth-migrate: { condition: service_completed_successfully }

  gateway:
    volumes:
      - ./deploy/nginx.app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mart-api
      - auth-api
