name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Docker image builds
        run: docker build -t ci-check .

  # Service tests against a real Postgres: concurrent sales, idempotent retries,
  # stock movements, rollback. The schema is reset on every test.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: martgo
          POSTGRES_PASSWORD: martgo
          POSTGRES_DB: martgo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U martgo -d martgo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://martgo:martgo@localhost:5432/martgo_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet (integration build tag)
        run: go vet -tags=integration ./...

      - name: Integration tests
        run: go test -tags=integration -race -count=1 ./...

  # Generated code and the API spec must match what is committed.
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: sqlc output is up to date
        run: make sqlc-check

      - name: OpenAPI spec is valid
        run: make lint-api
